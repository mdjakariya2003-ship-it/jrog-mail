name = "jrog-mail"
main = "worker.js"
compatibility_date = "2025-01-01"

# ওয়েব অ্যাপের ঠিকানা: https://mail.jrog.com
routes = [
  { pattern = "mail.jrog.com", custom_domain = true }
]

[vars]
DOMAIN = "jrog.com"

[[d1_databases]]
binding = "DB"
database_name = "jrog-mail"
database_id = "05e97bca-e8af-4bd4-b005-9870d983ca67"

# প্রতিদিন রাত ৩টায় (UTC) ৩০ দিনের পুরোনো মেইল মুছবে
[triggers]
crons = ["0 3 * * *"]
